name: Pedantic Checks

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  cpp-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: |
            /var/cache/apt/archives
            /usr/bin/cmake
            /usr/bin/ninja
            /usr/bin/clang-format
            /usr/bin/clang-tidy
            /usr/bin/cppcheck
          key: ${{ runner.os }}-apt-${{ hashFiles('.github/workflows/pedantic.yml') }}
          restore-keys: |
            ${{ runner.os }}-apt-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang-format clang-tidy cppcheck

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Cache CMake build
        uses: actions/cache@v4
        with:
          path: build
          key: ${{ runner.os }}-cmake-build-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'engine.cpp') }}
          restore-keys: |
            ${{ runner.os }}-cmake-build-

      - name: Configure CMake
        run: cmake --preset 9800X3D-Clang-Ninja

      - name: Build C++ extension
        run: cmake --build build --config Release

      - name: Run C++ format check (clang-format)
        run: |
          echo "[1/3] Running clang-format (C++ style check)..."
          make cpp-format-check

      - name: Run C++ static analysis (clang-tidy)
        run: |
          echo "[2/3] Running clang-tidy (C++ logic/perf check)..."
          make cpp-tidy

      - name: Run C++ safety check (cppcheck)
        run: |
          echo "[3/3] Running cppcheck (C++ safety check)..."
          make cpp-check

  python-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Python format check (ruff)
        run: |
          echo "[1/4] Running ruff format (Python style check)..."
          python -m ruff format --check --diff trading_bot.py test_error.py .tools/*.py

      - name: Run Python linting (ruff check)
        run: |
          echo "[2/4] Running ruff check (Python linting)..."
          python -m ruff check trading_bot.py test_error.py .tools/*.py

      - name: Run Python type check (mypy)
        run: |
          echo "[3/4] Running mypy (Python type check)..."
          python -m mypy trading_bot.py test_error.py

      - name: Run Python static analysis (pylint)
        run: |
          echo "[4/4] Running pylint (Python static analysis)..."
          python -m pylint trading_bot.py test_error.py

  pedantic-summary:
    runs-on: ubuntu-latest
    needs: [cpp-checks, python-checks]
    if: success()
    steps:
      - name: All checks passed
        run: |
          echo "============================================"
          echo "        ALL PEDANTIC CHECKS PASSED          "
          echo "============================================"
